$schema: ../schema/kamisama-design.schema.json
version: 1
includes:
  - financial.yaml
  - daemon.yaml
  - user-panel.yaml
  - admin-panel.yaml
hints:
  prefer-templates: true
  preview: concise
solution:
  name: LedgerFlow
  root: .
  solution-file: LedgerFlow.slnx
  create-directory: false
  use-props: true
  target-framework: net10.0
bootstrap:
  project: LedgerFlow.Bootstrap
  path: LedgerFlow.Bootstrap
  references:
    - LedgerFlow.Financial.Core
  registrations:
    - module: Financial
      provider: Financial.Postgresql
      enabled: true
external-services:
  - name: ExchangeRates
    kind: http
    base-url-setting: ExternalServices:ExchangeRates:BaseUrl
    client-contract: IExchangeRateClient
    owner: Financial
    required-by:
      - Daemon
    health-check: true
