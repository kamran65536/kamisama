$schema: ../schema/kamisama-design.schema.json
version: 1
modules:
  - name: UserPanel
    kind: panel
    path: Panels/UserPanel
    projects:
      - name: LedgerFlow.UserPanel.Abstractions
        role: abstractions
      - name: LedgerFlow.UserPanel.Core
        role: core
        references:
          - LedgerFlow.UserPanel.Abstractions
          - LedgerFlow.Financial.Abstractions
      - name: LedgerFlow.UserPanel.Client
        role: client
        references:
          - LedgerFlow.UserPanel.Abstractions
      - name: LedgerFlow.UserPanel.Server
        role: server
        references:
          - LedgerFlow.UserPanel.Client
          - LedgerFlow.UserPanel.Core
          - LedgerFlow.Bootstrap
    services:
      - name: ViewOwnAccount
        kind: orchestration
        contract: IViewOwnAccount
        input: Guid
        output: AccountDto
        calls:
          - Financial.FindAccountById
        transaction: none
        inferred: true
    apis:
      - name: OwnAccountsApi
        route: /api/accounts
        authorization: User
        endpoints:
          - operation: GetOwnAccount
            method: GET
            route: /{id}
            service: IViewOwnAccount
            response: AccountDto
            authorization: OwnerOrAdmin
            inferred: true
    pages:
      - name: AccountDetails
        route: /accounts/{id}
        kind: details
        entity: Account
        service: IViewOwnAccount
        authorization: User
        parameters:
          - name: id
            type: Guid
            source: route
        content:
          - id: account
            kind: details
            title: Account
            binding: Account
            fields:
              - name: Name
                visible: true
                editable: false
              - name: Balance
                visible: true
                editable: false
              - name: Status
                visible: true
                editable: false
