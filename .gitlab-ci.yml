image: mcr.microsoft.com/dotnet/core/sdk:3.1

stages:
    - build
    - test
    - publish

before_script:
    - "dotnet restore src/KamiSama.Extensions.sln"

build:
    stage: build
    script:
        - "dotnet build src/KamiSama.Extensions.sln"

test:
    stage: test
    script: 
        - "dotnet test src/KamiSama.Extensions.sln"


publish:
    echo $(nuget_apikey)